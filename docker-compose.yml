services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: poros
      POSTGRES_PASSWORD: poros
      POSTGRES_DB: poros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poros"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      POROS_DB: postgres://poros:poros@db:5432/poros?sslmode=disable
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q ok"]
      interval: 5s
      retries: 5

volumes:
  pgdata: {}
