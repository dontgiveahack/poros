name: ci

on:
  push:
    branches: [main]
  pull_request: # on any PR, any destination branch

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poros
          POSTGRES_PASSWORD: poros
          POSTGRES_DB: poros
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U poros"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POROS_DB: postgres://poros:poros@localhost:5432/poros?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: build
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5

      - name: build
        run: docker build -t poros:ci .
